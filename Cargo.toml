[workspace]
resolver = "2"
members = [
    "phono-junk-core",
    "phono-junk-toc",
    "phono-junk-identify",
    "phono-junk-musicbrainz",
    "phono-junk-discogs",
    "phono-junk-itunes",
    "phono-junk-barcodelookup",
    "phono-junk-tower",
    "phono-junk-accuraterip",
    "phono-junk-catalog",
    "phono-junk-db",
    "phono-junk-extract",
    "phono-junk-lib",
    "phono-junk-cli",
    "phono-junk-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Shared disc implementation, pinned so clean builds are reproducible.
junk-libs-core = { git = "https://github.com/AberrantWolf/junk-libs", rev = "0c8ac1a1ea3902f20a0e06ba2c922d2dc2b1774d" }
junk-libs-disc = { git = "https://github.com/AberrantWolf/junk-libs", rev = "0c8ac1a1ea3902f20a0e06ba2c922d2dc2b1774d" }

# Internal crates
phono-junk-core = { path = "phono-junk-core" }
phono-junk-toc = { path = "phono-junk-toc" }
phono-junk-identify = { path = "phono-junk-identify" }
phono-junk-musicbrainz = { path = "phono-junk-musicbrainz" }
phono-junk-discogs = { path = "phono-junk-discogs" }
phono-junk-itunes = { path = "phono-junk-itunes" }
phono-junk-barcodelookup = { path = "phono-junk-barcodelookup" }
phono-junk-tower = { path = "phono-junk-tower" }
phono-junk-accuraterip = { path = "phono-junk-accuraterip" }
phono-junk-catalog = { path = "phono-junk-catalog" }
phono-junk-db = { path = "phono-junk-db" }
phono-junk-extract = { path = "phono-junk-extract" }
phono-junk-lib = { path = "phono-junk-lib" }

# Third-party
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
toml = "0.8"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
crc32fast = "1.4"
md5 = "0.7"
url = "2"
log = { version = "0.4", features = ["std"] }
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
governor = "0.7"
nonzero_ext = "0.3"
httpmock = "0.7"
scraper = "0.20"
rusqlite = { version = "0.33", features = ["bundled"] }
dirs = "6"
chrono = "0.4"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
rpassword = "7"
zeroize = "1"
eframe = "0.30"
egui = "0.30"
egui_extras = { version = "0.30", features = ["image"] }
# Audio playback (phono-junk-gui only). Opt out of the default `symphonia`
# feature stack — we feed kira PCM through our own `Decoder` impl that wraps
# `junk_libs_disc::TrackPcmReader`, so the mp3/flac/ogg decoders kira bundles
# by default are dead weight. Keep only `cpal` for the output backend.
kira = { version = "0.12", default-features = false, features = ["cpal"] }
# `egui_extras`'s `image` feature turns on the `image` crate with no default
# features, so no codec can actually decode bytes. Pull the crate in directly
# with the formats we serve: JPEG + PNG + WebP (CAA, iTunes, Discogs).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rfd = "0.15"
walkdir = "2"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
uuid = { version = "1", features = ["v4"] }

[profile.dist]
inherits = "release"
lto = "thin"
